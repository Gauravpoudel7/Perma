[toolchain]
anchor_version = "1.2.0"

[features]
resolution = true
skip-lint = false

[programs.localnet]
perma = "4qhBfpjfLUSgaSBNEM9aBQw9FbN2QysqLUgkUtM6HDdt"

[programs.devnet]
perma = "4qhBfpjfLUSgaSBNEM9aBQw9FbN2QysqLUgkUtM6HDdt"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

